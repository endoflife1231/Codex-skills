name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build archives
        run: bash release/build_release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/out/*.zip
          release/out/*.json
          release/out/SHA256SUMS
          --verify-tag
          --title "Codex Powerpack $GITHUB_REF_NAME"
          --notes-file release/release_notes.md
