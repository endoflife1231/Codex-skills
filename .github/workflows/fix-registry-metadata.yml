name: Fix v0.2.1 registry metadata

on:
  push:
    branches: [main]
    paths:
      - '.registry-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild complete audited registry
        shell: bash
        run: |
          mkdir -p .audit-tmp
          echo '' | base64 -d | gzip -d > .audit-tmp/fix_registry_metadata.py
          python3 .audit-tmp/fix_registry_metadata.py
          rm -rf .audit-tmp
          rm -f .registry-fix-trigger
          rm -f .github/workflows/fix-registry-metadata.yml
      - name: Validate and build packages
        shell: bash
        run: |
          python3 dist/verify/validate_dist.py
          bash dist/verify/doctor.sh
          bash release/doctor_release.sh
          bash release/build_release.sh
      - name: Commit corrected metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve complete audited registry metadata'
          git push origin HEAD:main
          git tag -fa v0.2.1 -m 'Codex Powerpack v0.2.1'
          git push --force origin v0.2.1
      - name: Refresh GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.1 >/dev/null 2>&1; then
            gh release upload v0.2.1 release/out/*.zip release/out/*.json release/out/SHA256SUMS --clobber
            gh release edit v0.2.1 --title 'Codex Powerpack v0.2.1' --notes-file release/release_notes.md
          else
            gh release create v0.2.1 release/out/*.zip release/out/*.json release/out/SHA256SUMS --verify-tag --title 'Codex Powerpack v0.2.1' --notes-file release/release_notes.md
          fi
