name: Bootstrap open-source repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited source tree
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [ -n "$path" ] && rm -rf -- "$path"
          done <<'DELETE_PATHS'
dist/skills/catalog/apple-ui-design
dist/skills/catalog/ascii-art-beautifier
dist/skills/catalog/banner-design
dist/skills/catalog/bilingual-transcreator
dist/skills/catalog/brand
dist/skills/catalog/code-consistency-validator
dist/skills/catalog/code-review-expert
dist/skills/catalog/common-pitfalls
dist/skills/catalog/defi-expert
dist/skills/catalog/defi-mev-battletest
dist/skills/catalog/defi-registry-manager
dist/skills/catalog/deploy-to-vercel
dist/skills/catalog/design
dist/skills/catalog/design-system
dist/skills/catalog/en-ru-translator-adv
dist/skills/catalog/error-logger
dist/skills/catalog/find-skills
dist/skills/catalog/full-review
dist/skills/catalog/hft-quant-expert
dist/skills/catalog/iterative-runner
dist/skills/catalog/latency-tracker
dist/skills/catalog/liquidity-depth-analyzer
dist/skills/catalog/pitfalls-blockchain
dist/skills/catalog/pitfalls-drizzle-orm
dist/skills/catalog/pitfalls-express-api
dist/skills/catalog/pitfalls-react
dist/skills/catalog/pitfalls-security
dist/skills/catalog/pitfalls-tanstack-query
dist/skills/catalog/pitfalls-websocket
dist/skills/catalog/pixijs
dist/skills/catalog/pixijs-accessibility
dist/skills/catalog/pixijs-application
dist/skills/catalog/pixijs-assets
dist/skills/catalog/pixijs-blend-modes
dist/skills/catalog/pixijs-color
dist/skills/catalog/pixijs-core-concepts
dist/skills/catalog/pixijs-create
dist/skills/catalog/pixijs-custom-rendering
dist/skills/catalog/pixijs-environments
dist/skills/catalog/pixijs-events
dist/skills/catalog/pixijs-filters
dist/skills/catalog/pixijs-html-source
dist/skills/catalog/pixijs-math
dist/skills/catalog/pixijs-migration-v8
dist/skills/catalog/pixijs-performance
dist/skills/catalog/pixijs-scene-container
dist/skills/catalog/pixijs-scene-core-concepts
dist/skills/catalog/pixijs-scene-dom-container
dist/skills/catalog/pixijs-scene-gif
dist/skills/catalog/pixijs-scene-graphics
dist/skills/catalog/pixijs-scene-mesh
dist/skills/catalog/pixijs-scene-particle-container
dist/skills/catalog/pixijs-scene-sprite
dist/skills/catalog/pixijs-scene-text
dist/skills/catalog/pixijs-ticker
dist/skills/catalog/postgres-best-practices
dist/skills/catalog/ru-editor
dist/skills/catalog/ru-textovod
dist/skills/catalog/skill-auditor
dist/skills/catalog/skill-router
dist/skills/catalog/system-integration-validator
dist/skills/catalog/ui-ux-pro-max
dist/skills/catalog/vercel-cli-with-tokens
dist/skills/catalog/vercel-composition-patterns
dist/skills/catalog/vercel-optimize
dist/skills/catalog/vercel-react-best-practices
dist/skills/catalog/vercel-react-native-skills
dist/skills/catalog/vercel-react-view-transitions
dist/skills/catalog/web-design-guidelines
dist/skills/catalog/writing-guidelines
release/out
DELETE_PATHS
          cat .bootstrap/part-* | base64 --decode > /tmp/codex-update.tar.gz
          tar -xzf /tmp/codex-update.tar.gz -C .
          rm -rf .bootstrap release/out
          chmod +x install.sh update.sh uninstall.sh adapt-project.sh rollback.sh verify.sh
          chmod +x dist/install/install.sh dist/onboarding/adapt-project.sh dist/onboarding/rollback.sh dist/verify/doctor.sh
          chmod +x release/build_release.sh release/doctor_release.sh

      - name: Validate distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 dist/verify/validate_dist.py
          bash dist/verify/doctor.sh
          bash release/doctor_release.sh

      - name: Commit repository replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "release: publish open-source v0.2.0 repository"
          git push origin HEAD:main
