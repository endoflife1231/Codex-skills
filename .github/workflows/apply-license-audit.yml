name: Apply license audit v0.2.1

on:
  push:
    branches: [main]
    paths:
      - '.license-audit-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore audited skills and update metadata
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_license_audit.py
          python3 /tmp/apply_license_audit.py
          rm -f .license-audit-trigger
          rm -f .github/workflows/apply-license-audit.yml
          rm -f .github/workflows/publish-user-release.yml
          rm -f .release-trigger
      - name: Validate and build packages
        shell: bash
        run: |
          python3 dist/verify/validate_dist.py
          bash dist/verify/doctor.sh
          bash release/doctor_release.sh
          bash release/build_release.sh
      - name: Commit main and create tag
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: restore audited skills v0.2.1'
          git push origin HEAD:main
          git tag -a v0.2.1 -m 'Codex Powerpack v0.2.1'
          git push origin v0.2.1
