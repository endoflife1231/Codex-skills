name: Apply clean v0.2.2 repository state

on:
  push:
    branches: [main]
    paths:
      - '.v022-diagnose-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize, validate, and build
        shell: bash
        run: |
          set -euo pipefail
          python3 release/finalize_v022.py
          rm -f release/finalize_v022.py v022-finalizer-report.txt
          chmod +x install.sh update.sh uninstall.sh adapt-project.sh rollback.sh verify.sh
          chmod +x release/build_release.sh release/doctor_release.sh release/check_release_consistency.py
          find dist -type f -name '*.sh' -exec chmod +x {} +
          python3 release/check_release_consistency.py
          python3 dist/verify/validate_dist.py
          bash dist/verify/doctor.sh
          bash release/doctor_release.sh
          bash release/build_release.sh

      - name: Commit repository changes without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -rf release/out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: apply clean v0.2.2 repository state'
          git push origin HEAD:main
