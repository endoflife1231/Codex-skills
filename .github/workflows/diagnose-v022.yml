name: Diagnose v0.2.2 finalizer

on:
  push:
    branches: [main]
    paths:
      - '.v022-diagnose-trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test finalizer without committing changes
        shell: bash
        run: |
          set +e
          REPORT=v022-diagnostic.txt
          : > "$REPORT"
          echo "commit=$GITHUB_SHA" >> "$REPORT"
          python3 release/finalize_v022.py >/tmp/sync.log 2>&1
          SYNC=$?
          echo "sync_status=$SYNC" >> "$REPORT"
          cat /tmp/sync.log >> "$REPORT"
          if [ "$SYNC" -eq 0 ]; then
            python3 release/check_release_consistency.py >/tmp/consistency.log 2>&1
            CONSISTENCY=$?
            echo "consistency_status=$CONSISTENCY" >> "$REPORT"
            cat /tmp/consistency.log >> "$REPORT"

            python3 dist/verify/validate_dist.py >/tmp/dist.log 2>&1
            DIST=$?
            echo "dist_status=$DIST" >> "$REPORT"
            cat /tmp/dist.log >> "$REPORT"

            bash dist/verify/doctor.sh >/tmp/doctor.log 2>&1
            DOCTOR=$?
            echo "doctor_status=$DOCTOR" >> "$REPORT"
            cat /tmp/doctor.log >> "$REPORT"

            bash release/doctor_release.sh >/tmp/release-doctor.log 2>&1
            RELEASE_DOCTOR=$?
            echo "release_doctor_status=$RELEASE_DOCTOR" >> "$REPORT"
            cat /tmp/release-doctor.log >> "$REPORT"

            bash release/build_release.sh >/tmp/build.log 2>&1
            BUILD=$?
            echo "build_status=$BUILD" >> "$REPORT"
            cat /tmp/build.log >> "$REPORT"
          fi
          echo "--- changed files ---" >> "$REPORT"
          git status --short >> "$REPORT"

      - name: Commit diagnostic report only
        shell: bash
        run: |
          git restore --staged . || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f v022-diagnostic.txt
          git commit -m 'diagnostic: test v0.2.2 finalizer'
          git push origin HEAD:main
