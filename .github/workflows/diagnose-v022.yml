name: Diagnose v0.2.2 payload

on:
  push:
    branches: [main]
    paths:
      - '.v022-diagnose-trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect payload orders
        shell: bash
        run: |
          set +e
          REPORT=v022-diagnostic.txt
          : > "$REPORT"
          echo "commit=$GITHUB_SHA" >> "$REPORT"
          ls -l .release-payload/v022.part* >> "$REPORT" 2>&1

          test_order() {
            NAME="$1"
            shift
            cat "$@" | tr -d '\r\n\t ' > "/tmp/${NAME}.b64"
            base64 --decode "/tmp/${NAME}.b64" > "/tmp/${NAME}.tar.gz" 2>"/tmp/${NAME}.base64.err"
            B64=$?
            echo "[$NAME] base64_status=$B64 bytes=$(wc -c < /tmp/${NAME}.b64)" >> "$REPORT"
            cat "/tmp/${NAME}.base64.err" >> "$REPORT"
            if [ "$B64" -eq 0 ]; then
              sha256sum "/tmp/${NAME}.tar.gz" >> "$REPORT" 2>&1
              tar -tzf "/tmp/${NAME}.tar.gz" >"/tmp/${NAME}.list" 2>"/tmp/${NAME}.tar.err"
              TAR=$?
              echo "[$NAME] tar_status=$TAR files=$(wc -l < /tmp/${NAME}.list)" >> "$REPORT"
              cat "/tmp/${NAME}.tar.err" >> "$REPORT"
              tail -10 "/tmp/${NAME}.list" >> "$REPORT"
            fi
          }

          test_order default \
            .release-payload/v022.part00 \
            .release-payload/v022.part01 \
            .release-payload/v022.part02 \
            .release-payload/v022.part03 \
            .release-payload/v022.part04

          test_order swapped_last \
            .release-payload/v022.part00 \
            .release-payload/v022.part01 \
            .release-payload/v022.part02 \
            .release-payload/v022.part04 \
            .release-payload/v022.part03

      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v022-diagnostic.txt
          git commit -m 'diagnostic: compare v0.2.2 payload order'
          git push origin HEAD:main
