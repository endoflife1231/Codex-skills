name: Finalize clean v0.2.2 release

on:
  push:
    branches: [main]
    paths:
      - '.v022-finalize-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize repository metadata
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 release/finalize_v022.py 2>&1 | tee /tmp/v022-sync.log

      - name: Validate and build packages
        id: validate
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 release/check_release_consistency.py
            python3 dist/verify/validate_dist.py
            bash dist/verify/doctor.sh
            bash release/doctor_release.sh
            bash release/build_release.sh
          } 2>&1 | tee /tmp/v022-validate.log

      - name: Save failure report
        if: steps.sync.outcome != 'success' || steps.validate.outcome != 'success'
        shell: bash
        run: |
          {
            echo "sync=${{ steps.sync.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
            echo "--- sync log ---"
            cat /tmp/v022-sync.log 2>/dev/null || true
            echo "--- validation log ---"
            cat /tmp/v022-validate.log 2>/dev/null || true
          } > v022-finalizer-report.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v022-finalizer-report.txt
          git commit -m 'diagnostic: capture v0.2.2 finalizer failure'
          git push origin HEAD:main
          exit 1

      - name: Commit clean v0.2.2
        if: steps.sync.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish clean v0.2.2'
          git push origin HEAD:main
          git tag -a v0.2.2 -m 'Codex Powerpack v0.2.2'
          git push origin v0.2.2

      - name: Publish GitHub release
        if: steps.sync.outcome == 'success' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.2 >/dev/null 2>&1; then
            gh release upload v0.2.2 release/out/*.zip release/out/*.json release/out/SHA256SUMS --clobber
            gh release edit v0.2.2 --title 'Codex Powerpack v0.2.2' --notes-file release/release_notes.md
          else
            gh release create v0.2.2 \
              release/out/*.zip \
              release/out/*.json \
              release/out/SHA256SUMS \
              --verify-tag \
              --title 'Codex Powerpack v0.2.2' \
              --notes-file release/release_notes.md
          fi
